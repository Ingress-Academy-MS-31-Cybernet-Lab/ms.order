databaseChangeLog:
  # --------------------------------------------------------
  # 1. ORDERS TABLE
  # --------------------------------------------------------
  - changeSet:
      id: create-orders-table
      author: camil.camalov
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: gross_amount
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: shipping_amount
                  type: DECIMAL(19, 2)
                  defaultValueNumeric: "0"
              - column:
                  name: total_discount
                  type: DECIMAL(19, 2)
                  defaultValueNumeric: "0"
              - column:
                  name: net_amount
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              # --- Status & Audit ---
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: fail_reason
                  type: TEXT
              - column:
                  name: payment_id
                  type: VARCHAR(50)
              - column:
                  name: shipping_address
                  type: JSONB
              - column:
                  name: version
                  type: INT
                  defaultValueNumeric: "0"
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

  # Index:
  - changeSet:
      id: create-idx-orders-user
      author: camil.camalov
      changes:
        - createIndex:
            tableName: orders
            indexName: idx_orders_user_id
            columns:
              - column:
                  name: user_id

  # --------------------------------------------------------
  # 2. ORDER ITEMS TABLE
  # --------------------------------------------------------
  - changeSet:
      id: create-order-items-table
      author: camil.camalov
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_items_order
                    references: orders(id)
              - column:
                  name: product_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: supplier_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              # --- Qiymət & Snapshot ---
              - column:
                  name: unit_price
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: discount_share
                  type: DECIMAL(19, 2)
                  defaultValueNumeric: "0"
              - column:
                  name: final_price
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              # --- Settlement ---
              - column:
                  name: commission_rate
                  type: DECIMAL(5, 2)
              - column:
                  name: commission_amount
                  type: DECIMAL(19, 2)
              - column:
                  name: payout_amount
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              # --- Shipping Snapshot ---
              - column:
                  name: shipping_fee
                  type: DECIMAL(19, 2)
              - column:
                  name: shipping_type
                  type: VARCHAR(20)

  # Index:
  - changeSet:
      id: create-idx-items-supplier
      author: camil.camalov
      changes:
        - createIndex:
            tableName: order_items
            indexName: idx_items_supplier_id
            columns:
              - column:
                  name: supplier_id

  # --------------------------------------------------------
  # 3. ORDER DISCOUNTS TABLE
  # --------------------------------------------------------
  - changeSet:
      id: create-order-discounts-table
      author: camil.camalov
      changes:
        - createTable:
            tableName: order_discounts
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_discounts_order
                    references: orders(id)
              - column:
                  name: order_item_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_discounts_item
                    references: order_items(id)
              - column:
                  name: promo_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: discount_type
                  type: VARCHAR(20)
              - column:
                  name: amount
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: funded_by
                  type: VARCHAR(20) # PLATFORM vs SUPPLIER
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

  - changeSet:
      id: create-outbox-events-table
      author: camil.camalov
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: aggregate_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: processed
                  type: BOOLEAN
                  defaultValueBoolean: false

  - changeSet:
      id: create-idx-outbox-processed
      author: camil.camalov
      changes:
        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_processed
            columns:
              - column:
                  name: processed